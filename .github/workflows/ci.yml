name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine-and-build:
    name: 远征规则验收与构建可复现
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 规则验收和静态构建均只使用 Node 内置模块。
      - name: 远征规则验收
        run: node work/qa-expedition-engine.cjs
      - name: 重新构建游戏、手册与全书页
        run: npm run build
      - name: 成品与源码一致
        run: git diff --exit-code -- outputs/
      - name: 安装固定版本的验收依赖
        run: npm ci
      - name: 验证检索与游戏的无障碍交互
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: |
          npm run test:search
          npm run test:a11y
